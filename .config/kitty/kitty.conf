background_opacity 0.5
cursor_trail 1
enable_audio_bell no
remember_window_size no

map f1 launch --type=overlay kitty -o background_opacity=0 --start-as=fullscreen sh -c "tput civis && sleep 1d"
map f2 launch --type=overlay kitty -o background_opacity=0 --start-as=fullscreen sh -c "sleep 0.5 && cmatrix"
map shift+f2 launch --type=overlay kitty -o background_opacity=1 --start-as=fullscreen sh -c "sleep 0.5 && cmatrix"
map f3 launch --type=overlay kitty -o background_opacity=0 --start-as=fullscreen hollywood
map shift+f3 launch --type=overlay kitty -o background_opacity=1 --start-as=fullscreen hollywood
